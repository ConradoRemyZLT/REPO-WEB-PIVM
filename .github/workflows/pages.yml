# Publica la web de PIVM en GitHub Pages cada vez que se sube algo a main.
# El sitio ya está generado en el repo (index.html, empresas/, inversores/):
# acá solo se arma la copia publicable en _site/,
# sin las herramientas ni las fuentes de trabajo.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Armar el sitio
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html 404.html robots.txt sitemap.xml gate.js _site/
          cp -r empresas inversores css js fonts fotos logos iconos brochures videos _site/
          rm -f _site/fotos/manifest.json
          # Chequeo: ninguna página quedó sin generar
          for f in index.html empresas/index.html inversores/index.html; do
            test -s "_site/$f" || { echo "Falta $f: correr python3 build.py y volver a subir"; exit 1; }
          done
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
